# ATLAS — Fitness Intelligence Scraper
# ─────────────────────────────────────────────────────────────────
# Container roles:
#   api               REST API + SSE + dashboard SPA (port 4060)
#   worker            BullMQ crawl jobs — Playwright/Chromium heavy
#   enrichment-worker Graph enrichment loop (stages 1-7)
#   media-worker      Photo download + Sharp resize
#   mongo             MongoDB 7.0  (host port 27051)
#   redis             Redis 7.2    (host port 6847)
# Removed:
#   dashboard         Redundant — API serves built SPA from root /
# ─────────────────────────────────────────────────────────────────

services:

  # ── API server ──────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas-api
    restart: unless-stopped
    ports:
      - "4060:4060"
    env_file: .env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/atlas05
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=production
    volumes:
      - .:/app
      - /app/node_modules
      - ./media:/app/media
      - ./logs:/app/logs
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [opg]
    command: node src/server.js
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4060/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Crawl worker — Playwright-heavy, keep 1 replica per machine ─
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/atlas05
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=production
      - SCRAPER_CONCURRENCY=1
      - SCRAPER_PAGE_POOL=3
      - SCRAPER_HEADLESS=true
    volumes:
      - .:/app
      - /app/node_modules
      - ./media:/app/media
      - ./logs:/app/logs
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [opg]
    command: node src/queue/worker.js
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G   # Chromium requires headroom; do not lower

  # ── Enrichment worker — graph loop, low CPU except LLM stages ───
  enrichment-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/atlas05
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=production
      - ENRICHMENT_DELAY=2000
    volumes:
      - .:/app
      - /app/node_modules
      - ./media:/app/media
      - ./logs:/app/logs
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [opg]
    command: node src/queue/enrichmentWorker.js
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Media worker — Sharp image processing, only when downloads on ─
  media-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/atlas05
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=production
      - MEDIA_DOWNLOAD_ENABLED=true
      - MEDIA_WORKER_CONCURRENCY=8
    volumes:
      - .:/app
      - /app/node_modules
      - ./media:/app/media
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [opg]
    command: node src/queue/mediaWorker.js
    deploy:
      resources:
        limits:
          memory: 512M

  # ── MongoDB ─────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: atlas-mongo
    restart: unless-stopped
    ports:
      - "27051:27017"
    volumes:
      - mongo_data:/data/db
    command: mongod --wiredTigerCacheSizeGB 1
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [opg]

  # ── Redis ────────────────────────────────────────────────────────
  # noeviction is required by BullMQ — allkeys-lru would silently drop queue jobs
  redis:
    image: redis:7.2-alpine
    container_name: atlas-redis
    restart: unless-stopped
    ports:
      - "6847:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy noeviction
    deploy:
      resources:
        limits:
          memory: 300M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [opg]

volumes:
  mongo_data:
  redis_data:

networks:
  opg:
    driver: bridge
